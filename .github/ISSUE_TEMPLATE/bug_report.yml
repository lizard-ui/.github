name: Bug Report
description: Report a bug in lizard-ui (org meta or package — specify below)
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For **component/library** issues, prefer opening the issue on [lizard-ui/lizard-ui](https://github.com/lizard-ui/lizard-ui) unless this is org-meta only (profile, `.github` templates).

  - type: dropdown
    id: repo
    attributes:
      label: Repository
      options:
        - lizard-ui/lizard-ui (npm package)
        - lizard-ui/.github (org meta)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Install lizard-ui@…
        2. Render Component …
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - lizard-ui version: [e.g. 0.1.0]
        - React / react-dom: [e.g. 19.x]
        - Node or Bun: [e.g. Node 22, Bun 1.3]
        - Browser (if website): [e.g. Chrome 131]
        - OS: [e.g. macOS 15]
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      placeholder: Screenshots, stack traces, minimal repro repo…

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues (package and org repos) for duplicates
          required: true
        - label: I am on the latest lizard-ui release (if applicable)
          required: true
